    previousSessionCopyDetailSessionKey === destinationSessionKey;

  let disabledReason = "";

  if (isPreviousSessionCopyLoading) {

  } else if (isSaving) {

  } else if (!Array.isArray(studentsCache) || studentsCache.length === 0) {

  } else if (isDirty) {
    disabledReason = "\u5165\u529b\u9014\u4e2d\u306e\u305f\u3081\u30b3\u30d4\u30fc\u3067\u304d\u307e\u305b\u3093\u3002";
  } else if (destinationSaved) {
    disabledReason = "\u3053\u306e\u6388\u696d\u306f\u4fdd\u5b58\u6e08\u307f\u306e\u305f\u3081\u30b3\u30d4\u30fc\u3067\u304d\u307e\u305b\u3093\u3002";

  } else if (sourceClass.saveStatusNotLoaded && !sourceStatus.isSaved) {

  } else if (!sourceStatus.isSaved) {

function buildPreviousSessionCopyNextAttendanceState(
  result,
  expectedSourceIdentity,
  expectedDestinationIdentity
) {
  if (!result || result.ok !== true) return null;

  if (
    getPreviousSessionCopyClientIdentity(result.source) !== expectedSourceIdentity ||
    getPreviousSessionCopyClientIdentity(result.destination) !== expectedDestinationIdentity
  ) {
    return null;
  }

  const currentStudentIds = buildPreviousSessionCopySortedStudentIds(studentsCache);
  const responseStudentIds = buildPreviousSessionCopySortedResponseIds(result.studentIds);

  if (
    !currentStudentIds ||
    !responseStudentIds ||
    currentStudentIds.length === 0 ||
    currentStudentIds.length !== responseStudentIds.length
  ) {
    return null;
  }

  for (let i = 0; i < currentStudentIds.length; i++) {
    if (currentStudentIds[i] !== responseStudentIds[i]) return null;
  }

  const rawAttendanceMap = result.attendanceMap;
  if (
    !rawAttendanceMap ||
    typeof rawAttendanceMap !== "object" ||
    Array.isArray(rawAttendanceMap)
  ) {
    return null;
  }

  const nextState = {};
  const currentStudentIdSet = {};

  currentStudentIds.forEach(function(studentId) {
    currentStudentIdSet[studentId] = true;
    nextState[studentId] = "";
  });

  const allowedCodes = {
    A: true,
    L: true,
    O: true
  };
  const seenAttendanceStudentIds = {};
  const rawStudentIds = Object.keys(rawAttendanceMap);

  for (let i = 0; i < rawStudentIds.length; i++) {
    const rawStudentId = rawStudentIds[i];
    const studentId = normalizePreviousSessionCopyClientValue(rawStudentId);
    const statusCode = normalizePreviousSessionCopyClientValue(
      rawAttendanceMap[rawStudentId]
    );

    if (
      !studentId ||
      seenAttendanceStudentIds[studentId] ||
      !currentStudentIdSet[studentId] ||
      !allowedCodes[statusCode]
    ) {
      return null;
    }

    seenAttendanceStudentIds[studentId] = true;
    nextState[studentId] = statusCode;
  }

  return nextState;
}

function tryApplyPreviousSessionCopyResult(
  result,
  expectedSourceIdentity,
  expectedDestinationIdentity
) {
  if (
    currentMode !== "today" ||
    !selectedClass ||
    isDirty ||
    isSaving ||
    getPreviousSessionCopyClientIdentity(selectedClass) !== expectedDestinationIdentity ||
    previousSessionCopyDetailSessionKey !== getSessionKey(selectedClass)
  ) {
    return false;
  }

  const currentSourceClass = getPreviousSessionCopyCandidate(selectedClass);
  if (
    !currentSourceClass ||
    getPreviousSessionCopyClientIdentity(currentSourceClass) !== expectedSourceIdentity
  ) {
    return false;
  }

  const nextAttendanceState = buildPreviousSessionCopyNextAttendanceState(
    result,
    expectedSourceIdentity,
    expectedDestinationIdentity
  );

  if (!nextAttendanceState) return false;

  attendanceState = nextAttendanceState;
  renderStudents();
  renderSummary();
  previousSessionCopyAppliedState = {
    sourcePeriod: normalizePreviousSessionCopyClientValue(currentSourceClass.period),
    sourceIdentity: expectedSourceIdentity,
    destinationIdentity: expectedDestinationIdentity
  };
  markDirty(true);
  return true;
}

function handlePreviousSessionCopyClick() {
  const state = getPreviousSessionCopyUiState();
  if (!state || !state.canCopy || isPreviousSessionCopyLoading) return;

  const expectedSourceIdentity =
    getPreviousSessionCopyClientIdentity(state.sourceClass);
  const expectedDestinationIdentity =
    getPreviousSessionCopyClientIdentity(state.destinationClass);
  const requestToken = ++previousSessionCopyRequestToken;

  isPreviousSessionCopyLoading = true;
  renderPreviousSessionCopyArea();
  clearMessage();
  showMessage("\u524d\u6642\u9650\u306e\u51fa\u6b20\u3092\u78ba\u8a8d\u4e2d...", "warn");

  const destinationRequest = {
    classId: state.destinationClass.classId,
    date: state.destinationClass.date,
    period: state.destinationClass.period,
    sessionNumber: state.destinationClass.sessionNumber
  };

  google.script.run
    .withSuccessHandler(function(result) {
      if (requestToken !== previousSessionCopyRequestToken) return;

      isPreviousSessionCopyLoading = false;

      if (
        currentMode !== "today" ||
        !selectedClass ||
        getPreviousSessionCopyClientIdentity(selectedClass) !== expectedDestinationIdentity
      ) {
        renderPreviousSessionCopyArea();
        return;
      }

      if (!result || result.ok !== true) {
        renderPreviousSessionCopyArea();
        showMessage(
          getPreviousSessionCopyFailureMessage(result && result.code),
          "warn"
        );
        return;
      }

      if (
        !tryApplyPreviousSessionCopyResult(
          result,
          expectedSourceIdentity,
          expectedDestinationIdentity
        )
      ) {
        renderPreviousSessionCopyArea();
        showMessage(
          "\u30b3\u30d4\u30fc\u7d50\u679c\u3092\u9069\u7528\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002\u6388\u696d\u3092\u958b\u304d\u76f4\u3057\u3066\u518d\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002",
          "warn"
        );
        return;
      }

      const sourcePeriod = normalizePreviousSessionCopyClientValue(
        result.source && result.source.period
      );
      const successMessage =
        sourcePeriod + "\u9650\u306e\u51fa\u6b20\u3092\u30b3\u30d4\u30fc\u3057\u307e\u3057\u305f\u3002\u5185\u5bb9\u3092\u78ba\u8a8d\u3057\u3066\u4fdd\u5b58\u3057\u3066\u304f\u3060\u3055\u3044\u3002";

      setSaveStateText(successMessage);
      showMessage(successMessage, "warn");
      renderPreviousSessionCopyArea();
    })
    .withFailureHandler(function(error) {
      if (requestToken !== previousSessionCopyRequestToken) return;

      isPreviousSessionCopyLoading = false;
      renderPreviousSessionCopyArea();

      if (
        currentMode === "today" &&
        selectedClass &&
        getPreviousSessionCopyClientIdentity(selectedClass) === expectedDestinationIdentity
      ) {
        showMessage(
          "\u524d\u6642\u9650\u306e\u51fa\u6b20\u3092\u30b3\u30d4\u30fc\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002",
          "error"
        );
      }

      console.error(error);
    })
    .getPreviousTeacherSessionAttendanceCopyPreview(destinationRequest);
}

    function loadRiskForSelectedClassOnDemand() {
  if (!selectedClass || !studentsCache || studentsCache.length === 0 || isRiskLoading) {
    return;
  }

  const group = requiresGroupSelection(selectedClass)
    ? (selectedGroupByClassCache[selectedClass.classId] || "")
    : "";

  const riskCacheKey = group
    ? selectedClass.classId + "__" + group
    : selectedClass.classId;

  riskVisible = true;

  if (Object.prototype.hasOwnProperty.call(riskMapCache, riskCacheKey)) {
    riskMapState = riskMapCache[riskCacheKey] || {};
    isRiskLoading = false;
    renderSummary();
    renderStudents();
    return;
  }

  loadRiskMapForCurrentSelection(selectedClass, group, studentsCache, riskCacheKey);
}

    function bindStatusButtonEvents() {
      document.querySelectorAll(".status-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          const studentId = btn.dataset.studentId;
          const statusCode = btn.dataset.statusCode;

          attendanceState[studentId] = statusCode;
          renderStudents();
          renderSummary();
          clearMessage();
          markDirty(true);
        });
      });
    }

    function applyAttendanceMap(attendanceMap) {
      studentsCache.forEach(function(student) {
        attendanceState[student.studentId] = "";
      });

      if (attendanceMap) {
        Object.keys(attendanceMap).forEach(function(studentId) {
          if (attendanceMap[studentId] != null) {
            attendanceState[studentId] = attendanceMap[studentId];
          }
        });
      }
    }

    function buildPayload(cls) {
      const records = [];

      studentsCache.forEach(function(student) {
        const code = attendanceState[student.studentId] || "";
        records.push({
          studentId: student.studentId,
          statusCode: code
        });
      });

      const group = requiresGroupSelection(cls) ? (selectedGroupByClassCache[cls.classId] || "") : "";

      return {
        classId: cls.classId,
        date: cls.date,
        period: cls.period,

      studentsCache = [];
      attendanceState = {};
      riskMapState = {};
      isRiskLoading = false;
      isDirty = false;

      savedSessionKeys = {};
      studentsByClassCache = {};
      attendanceMapCache = {};
      riskMapCache = {};
      selectedGroupByClassCache = {};
      groupListByClassCache = {};

      renderClassList();
      setLoadingDetail();
      setTopActionButtonsDisabled(true);
      savePastSearchDate(targetDate);
      setPastSearchLoading(true);

      google.script.run
        .withSuccessHandler(function(classes) {
          debugLog("loadPastClassesByDate raw classes", classes);

          if (requestToken !== classListRequestToken || currentMode !== "past") return;

          const normalizedClasses = Array.isArray(classes) ? classes : [];
          debugLog("loadPastClassesByDate normalized length", normalizedClasses.length);

          if (normalizedClasses.length === 0 && attempt < CLASS_LIST_EMPTY_RETRY_MAX) {
            debugLog("loadPastClassesByDate retry trigger", { attempt: attempt, nextAttempt: attempt + 1 });

            window.setTimeout(function() {
              if (requestToken !== classListRequestToken || currentMode !== "past") return;
              loadPastClassesByDate(targetDate, attempt + 1);
            }, CLASS_LIST_EMPTY_RETRY_MS);
            return;
          }

          classesCache = normalizedClasses;
          isClassListLoading = false;
          setPastSearchLoading(false);
          debugLog("loadPastClassesByDate classesCache set", classesCache);

          if (!classesCache.length) {
            renderClassList();
            document.getElementById("selectedClassInfo").innerHTML = "該当日の担当授業はありません。";
            document.getElementById("studentArea").innerHTML = '<div class="empty-box">修正対象の授業はありません。</div>';
            document.getElementById("summaryArea").innerHTML = "";
            document.getElementById("sortNote").textContent = "";
            renderLastSavedInfoBar(null);
            setSaveStateText("");
            return;
          }

          loadSaveStatusForPastClasses(requestToken);
         
          if (
            pendingUnsavedTeacherSession &&
            String(pendingUnsavedTeacherSession.date || "") === String(targetDate || "")
          ) {
            const matched = classesCache.find(function(cls) {
              return (
                String(cls.classId || "") === String(pendingUnsavedTeacherSession.classId || "") &&
                String(cls.period || "") === String(pendingUnsavedTeacherSession.period || "")
              );
            });

            pendingUnsavedTeacherSession = null;

            if (matched) {
              selectClass(matched);
              return;
            }
          }
          clearPreviousSessionCopyAppliedState();
          selectedClass = null;
          document.getElementById("selectedClassInfo").innerHTML =
            "過去授業カードから操作を選択してください。";
          document.getElementById("studentArea").innerHTML =
            '<div class="empty-box">過去授業を修正する場合は「出席を入力・確認」から名簿を開いてください。<br>欠席・遅刻・公欠がなかった授業は「全員出席で完了」で全員出席として記録できます。</div>';
          document.getElementById("summaryArea").innerHTML = "";
          document.getElementById("sortNote").textContent = "";
          renderLastSavedInfoBar(null);
          setSaveStateText("");
          setTopActionButtonsDisabled(true);
        })
        .withFailureHandler(function(error) {
          if (requestToken !== classListRequestToken || currentMode !== "past") return;

          isClassListLoading = false;
          setPastSearchLoading(false);
          document.getElementById("classListArea").innerHTML = '<div class="empty-box">授業情報の読み込みに失敗しました。</div>';
          document.getElementById("selectedClassInfo").innerHTML = "授業情報の読み込みに失敗しました。";
          document.getElementById("studentArea").innerHTML = '<div class="empty-box">読み込みに失敗しました。</div>';
          document.getElementById("sortNote").textContent = "";
          showMessage("授業情報の読み込みに失敗しました", "error");
          console.error(error);
        })
        .getClassesForCurrentUserByDate(targetDate);
    }

  function initButtons() {
  const goHomeButton = document.getElementById("goHomeButton");
  const masqueradeApplyButton = document.getElementById("masqueradeApplyButton");
  const masqueradeClearButton = document.getElementById("masqueradeClearButton");
  const resetBtn = document.getElementById("resetPresentButton");
  const saveTopBtn = document.getElementById("saveButtonTop");
  const saveBottomBtn = document.getElementById("saveButtonBottom");
  const modeTodayBtn = document.getElementById("modeTodayBtn");
  const modePastBtn = document.getElementById("modePastBtn");
  const searchPastButton = document.getElementById("searchPastButton");
  const pastDateInput = document.getElementById("pastDateInput");
  const teacherUnsavedToggleBtn = document.getElementById("teacherUnsavedToggleBtn");
  const returnToLessonListButton = document.getElementById("returnToLessonListButton");

    if (goHomeButton) {
    goHomeButton.addEventListener("click", goHome);
  }

  if (masqueradeApplyButton) {
    masqueradeApplyButton.addEventListener("click", applyMasqueradeFromUi);
  }

  if (masqueradeClearButton) {
    masqueradeClearButton.addEventListener("click", clearMasqueradeFromUi);
  }

  if (resetBtn) {
    resetBtn.addEventListener("click", function() {
      if (!studentsCache || studentsCache.length === 0) return;

      studentsCache.forEach(function(student) {
        attendanceState[student.studentId] = "";
      });

      renderStudents();
      renderSummary();
      clearMessage();
      markDirty(true);
    });
  }

  if (saveTopBtn) saveTopBtn.addEventListener("click", handleSaveClick);
  if (saveBottomBtn) saveBottomBtn.addEventListener("click", handleSaveClick);

  if (modeTodayBtn) {
    modeTodayBtn.addEventListener("click", function() {
      if (isDirty) {
        const ok = window.confirm("保存されていない変更があります。切り替えますか？");
        if (!ok) return;
      }
      currentMode = "today";
      updateModeUI();
      clearMessage();
      
      loadTodayClasses();
    });
  }

  if (modePastBtn) {
    modePastBtn.addEventListener("click", function() {
      if (isDirty) {
        const ok = window.confirm("保存されていない変更があります。切り替えますか？");
        if (!ok) return;
      }
      currentMode = "past";
      pastWorkspaceView = "list";
      pastPeriodFilter = "";
      updateModeUI();
      clearMessage();
      

      const savedDate = loadPastSearchDate();
      if (pastDateInput) {
        if (savedDate) {
          pastDateInput.value = savedDate;
        } else {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, "0");
          const dd = String(today.getDate()).padStart(2, "0");
          pastDateInput.value = yyyy + "-" + mm + "-" + dd;
        }
      }

      document.getElementById("quickClassNav").style.display = "none";
      document.getElementById("classListArea").innerHTML = '<div class="empty-box">日付を選択して検索してください。</div>';
      document.getElementById("selectedClassInfo").innerHTML = "過去授業を検索してください。";
      document.getElementById("studentArea").innerHTML = '<div class="empty-box">修正対象授業を選択すると学生一覧を表示します。</div>';
      document.getElementById("summaryArea").innerHTML = "";
      document.getElementById("sortNote").textContent = "";
      setSaveStateText("");
      setTopActionButtonsDisabled(true);
    });
  }

  if (searchPastButton) {
    searchPastButton.addEventListener("click", function() {
      const value = pastDateInput ? pastDateInput.value : "";
      if (!value) {
        showMessage("検索日を選択してください", "warn");
        return;
      }
      savePastSearchDate(value);
      clearMessage();
      loadPastClassesByDate(value);
    });
  }

  if (pastDateInput) {
    pastDateInput.addEventListener("change", function() {
      savePastSearchDate(pastDateInput.value || "");
    });
  }

  if (teacherUnsavedToggleBtn) {
    teacherUnsavedToggleBtn.addEventListener("click", toggleTeacherUnsavedDetails);
  }

  if (returnToLessonListButton) {
    returnToLessonListButton.addEventListener("click", returnToPastLessonList);
  }

  const groupSelect = document.getElementById("groupSelect");
  if (groupSelect) {
    groupSelect.addEventListener("change", function() {
      if (!selectedClass) return;

      const nextGroup = groupSelect.value || "";

      if (isDirty) {
        const ok = window.confirm("保存されていない変更があります。班を切り替えますか？");
        if (!ok) {
          groupSelect.value = selectedGroupByClassCache[selectedClass.classId] || "";
          return;
        }
      }

      selectedGroupByClassCache[selectedClass.classId] = nextGroup;

      if (!nextGroup) {
        studentsCache = [];
        attendanceState = {};
        riskMapState = {};
        isRiskLoading = false;
        isDirty = false;
        renderClassList();

        renderSelectedClassInfo();
        document.getElementById("studentArea").innerHTML = '<div class="empty-box">まず担当する班を選択してください。</div>';
        document.getElementById("summaryArea").innerHTML = "";
        document.getElementById("sortNote").textContent = "";
        renderLastSavedInfoBar(null);
        clearMessage();
        setSaveStateText("班を選択してください");
        setTopActionButtonsDisabled(true);
        return;
      }

      loadClassDetailWithGroup(selectedClass, nextGroup);
    });
  }
}

    function chooseInitialClass(classes) {
      if (!classes || classes.length === 0) return null;

      if (preSelectedSession.classId) {
        const matched = classes.find(function(c) {
          return (
            c.classId === preSelectedSession.classId &&
            c.date === preSelectedSession.date &&
            String(c.period) === String(preSelectedSession.period)
          );
        });

        if (matched) return matched;
      }

      return null;
    }

    function init() {
      debugLog("init start", {
        preSelectedSession: preSelectedSession,
        today: getTodayDateKeyJst()
      });

        initButtons();
         loadMasqueradeUiState();

      const linkedDate = (preSelectedSession && preSelectedSession.date) ? preSelectedSession.date : "";
      const todayYmd = getTodayDateKeyJst();

      if (linkedDate && linkedDate !== todayYmd) {
        currentMode = "past";
        updateModeUI();

        const pastDateInput = document.getElementById("pastDateInput");
        if (pastDateInput) {
          pastDateInput.value = linkedDate;
        }

        savePastSearchDate(linkedDate);
        loadTeacherUnsavedSummary();
        loadPastClassesByDate(linkedDate);
        return;
      }

    currentMode = "today";
    updateModeUI();
    renderPageSubText();

teacherUnsavedSummaryData = null;
teacherUnsavedDetailsData = null;
scheduleInitialTeacherUnsavedSummaryLoad();

      loadTodayClasses();
    }

    init();
  </script>
</body>
</html>
