<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>担任出席管理（SHR）</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #d9e1ec;
      --text: #1f2a37;
      --sub: #6b7280;
      --primary: #2f6feb;
      --primary-soft: #eef4ff;
      --danger: #a12622;
      --danger-soft: #fdecec;
      --warn: #8a5a00;
      --warn-soft: #fff4db;
      --ok: #1d6b37;
      --ok-soft: #e8f7ec;
      --shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .hero {
      background: linear-gradient(135deg, #1f4fa3 0%, #2f6feb 100%);
      color: #fff;
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 8px 24px rgba(31, 79, 163, 0.18);
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .hero p {
      margin: 0;
      line-height: 1.8;
      font-size: 14px;
      opacity: 0.96;
    }

        .hero-actions {
      margin-bottom: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .hero-actions .main-btn {
      width: auto;
    }

    @media (max-width: 768px) {
      .hero-actions {
        justify-content: stretch;
      }

      .hero-actions .main-btn {
        width: 100%;
      }
    }

    /* CENTER TOAST MESSAGE UI - aligned with teacher screen */
    .message {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 9999;
      width: min(520px, calc(100vw - 32px));
      min-height: 0;
      margin: 0;
      padding: 14px 18px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #eef3ff;
      color: #1f3c88;
      box-shadow:
        0 16px 40px rgba(22, 35, 60, 0.20),
        0 4px 12px rgba(22, 35, 60, 0.12);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -46%) scale(0.98);
      transition:
        opacity 0.16s ease,
        transform 0.16s ease,
        visibility 0.16s ease;
    }

    .message.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .message.success {
      border-color: #a9d9b7;
      background: #e8f7ec;
      color: #1d6b37;
    }

    .message.error {
      border-color: #efb9b9;
      background: #fdecec;
      color: #a12622;
    }

    .message.warn {
      border-color: #ecd39a;
      background: #fff4db;
      color: #8a5a00;
    }

    @media (max-width: 768px) {
      .message {
        top: 46%;
        width: calc(100vw - 24px);
        padding: 13px 14px;
        font-size: 13px;
      }
    }

        .unsaved-summary-box {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      background: var(--card);
      border: 1px solid var(--line);
    }

    .unsaved-summary-box.loading {
      background: #f7f9fc;
      color: var(--sub);
    }

    .unsaved-summary-box.ok {
      background: #eef4ff;
      color: #1f4fa3;
      border-color: #d6e4ff;
    }

    .unsaved-summary-box.warn {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: #f0d59c;
    }

    .unsaved-summary-box.error {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #efc2c2;
    }

    .unsaved-summary-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .unsaved-summary-sub {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 220px auto auto;
      gap: 12px;
      align-items: end;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }

    .toolbar-block { min-width: 0; }

    .toolbar-label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      border: 1px solid #ccd5e3;
      background: #fff;
      color: #334;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip-btn:hover {
      background: #f8fbff;
      border-color: #9db7ef;
    }

    .chip-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .date-input {
      width: 100%;
      border: 1px solid #ccd5e3;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      background: #fff;
    }

    .main-btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }

    .main-btn.secondary {
      background: #eef2f7;
      color: #334;
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .summary-label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
    }

    .table-wrap {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .table-sub {
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
    }

    .save-state {
      font-size: 13px;
      color: var(--sub);
    }

    .table-scroller {
      overflow: auto;
      /* max-height: 72vh; */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
    }

    th, td {
      border-bottom: 1px solid #e8edf5;
      padding: 12px 10px;
      text-align: center;
      vertical-align: middle;
      background: #fff;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fbff;
      font-size: 13px;
      color: #445;
    }

    th.name-col,
    td.name-col {
      text-align: left;
      min-width: 220px;
      position: sticky;
      left: 74px;
      z-index: 1;
      background: #fff;
    }

    th.no-col,
    td.no-col {
      width: 74px;
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fff;
    }

    th.name-col { z-index: 3; background: #f8fbff; }
    th.no-col { z-index: 3; background: #f8fbff; }

    .student-name {
      font-weight: 700;
      font-size: 14px;
    }

    .student-meta {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
    }

    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid transparent;
      transition: 0.15s;
      min-width: 88px;
      justify-content: center;
    }

    .radio-label input {
      margin: 0;
      accent-color: var(--primary);
    }

    .radio-label.present { background: #f7fbf7; color: #215b33; }
    .radio-label.absent  { background: #fff3f3; color: #9b2020; }
    .radio-label.late    { background: #fff8ea; color: #8a5a00; }
    .radio-label.early   { background: #eef4ff; color: #1f4fa3; }

    tr.modified-row td {
      background: #fffdf2;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: #fbfcff;
    }

    .empty-box {
      padding: 40px 20px;
      text-align: center;
      color: var(--sub);
      line-height: 1.8;
    }

    @media (max-width: 980px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer-actions {
        justify-content: stretch;
        flex-direction: column;
      }

      .main-btn {
        width: 100%;
      }
    }

    @media (max-width: 768px) {
      .page {
        padding: 16px 12px 32px;
      }

      .hero {
        padding: 18px 16px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .hero p {
        font-size: 13px;
      }

      .table-header {
        padding: 14px 12px;
      }

      .table-scroller {
        max-height: none;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
      }

      table {
        min-width: 720px;
      }

      th,
      td {
        padding: 10px 6px;
        font-size: 12px;
      }

      th.no-col,
      td.no-col {
        width: 56px;
        min-width: 56px;
      }

      th.name-col,
      td.name-col {
        min-width: 8em;
        left: 56px;
      }

      .student-name {
        font-size: 13px;
      }

      .student-meta {
        font-size: 11px;
        word-break: break-all;
      }

      .radio-label {
        min-width: 64px;
        padding: 8px 6px;
        font-size: 12px;
      }
    }
    
        .unsaved-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .unsaved-summary-texts {
      min-width: 0;
      flex: 1;
    }

    .unsaved-toggle-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .unsaved-toggle-btn:hover {
      opacity: 0.9;
    }

    .unsaved-details-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }

    .unsaved-details-content {
      display: grid;
      gap: 8px;
    }

    .unsaved-detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 10px;
    }

    .unsaved-detail-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .unsaved-detail-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }

    .unsaved-open-btn {
      appearance: none;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .unsaved-open-btn:hover {
      opacity: 0.92;
    }

    .unsaved-open-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .unsaved-detail-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .unsaved-select-checkbox {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .unsaved-select-checkbox:disabled {
      cursor: not-allowed;
    }

    .unsaved-bulk-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
    }

    .unsaved-bulk-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .unsaved-bulk-btn {
      appearance: none;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .unsaved-bulk-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .unsaved-empty-note {
      font-size: 13px;
      color: var(--sub);
      padding: 4px 0;
    }

    @media (max-width: 720px) {
      .unsaved-summary-head {
        flex-direction: column;
        align-items: stretch;
      }

      .unsaved-toggle-btn {
        align-self: flex-start;
      }

      .unsaved-detail-item {
        flex-direction: column;
        align-items: stretch;
      }

      .unsaved-bulk-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .unsaved-bulk-btn,
      .unsaved-open-btn {
        width: 100%;
      }

      .unsaved-open-btn {
        align-self: stretch;
      }
    }

  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>担任出席管理（SHR）</h1>
      <p>未変更の学生は「出席」として保存されます。欠席・遅刻・早退学生だけを切り替えて保存してください。</p>
    </div>

        <div class="hero-actions">
      <button id="backHomeTopBtn" class="main-btn secondary" type="button">トップへ戻る</button>
    </div>

    <div id="messageArea" class="message"></div>

    <div class="toolbar">
      <div class="toolbar-block">
        <div class="toolbar-label">担任クラス</div>
        <div id="classChipList" class="chip-list"></div>
      </div>

      <div class="toolbar-block">
        <div class="toolbar-label">記録日</div>
        <input id="dateInput" class="date-input" type="date">
      </div>

      <button id="reloadBtn" class="main-btn secondary" type="button">再読込</button>
      <button id="saveBtnTop" class="main-btn" type="button">保存する</button>
    </div>

  
  <div id="unsavedShrSummaryBox" class="unsaved-summary-box loading">
  <div class="unsaved-summary-head">
    <div class="unsaved-summary-texts">
      <div id="unsavedShrSummaryTitle" class="unsaved-summary-title">未保存のSHRを確認中...</div>
      <div id="unsavedShrSummarySub" class="unsaved-summary-sub">4月7日以降の未保存状況を確認しています。</div>
    </div>
    <button id="unsavedShrToggleBtn" class="unsaved-toggle-btn" type="button" hidden>
      <span id="unsavedShrToggleLabel">詳細を見る</span>
      <span id="unsavedShrToggleIcon">▼</span>
    </button>
  </div>

  <div id="unsavedShrDetailsBox" class="unsaved-details-box" hidden>
    <div id="unsavedShrDetailsContent" class="unsaved-details-content"></div>
  </div>
</div>


    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">出席</div>
        <div id="countPresent" class="summary-value">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">欠席</div>
        <div id="countAbsent" class="summary-value">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">遅刻</div>
        <div id="countLate" class="summary-value">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">早退</div>
        <div id="countEarly" class="summary-value">0</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <div>
          <h2 id="tableTitle" class="table-title">読み込み中...</h2>
          <div id="tableSub" class="table-sub">しばらくお待ちください。</div>
        </div>
        <div id="saveState" class="save-state"></div>
        <div id="lastSavedInfo" class="save-state"></div>
      </div>

      <div id="tableContainer" class="table-scroller">
        <div class="empty-box">データを読み込んでいます...</div>
      </div>

      <div class="footer-actions">
        <button id="backBtn" class="main-btn secondary" type="button">トップへ戻る</button>
        <button id="saveBtnBottom" class="main-btn" type="button">保存する</button>
      </div>
    </div>
  </div>

  <script>
    const STATUS_OPTIONS = [
      { code: "",  label: "出席", className: "present" },
      { code: "A", label: "欠席", className: "absent"  },
      { code: "L", label: "遅刻", className: "late"    },
      { code: "E", label: "早退", className: "early"   }
    ];

    let initialData = null;
    let selectedGrade = "";
    let selectedUnit = "";
    let currentDate = "";
    let studentsState = [];
    let isLoading = false;
    let isSaving = false;
    let unsavedSummaryRequestKey = "";
    let unsavedShrDetailsRequestKey = "";
    let unsavedShrDetailsLoadedKey = "";
    let unsavedShrDetailsOpen = false;
    let currentShrHasSavedSession = false;
    let currentShrLastSavedInfo = null;
    let isShrStatusLoading = false;
    let unsavedShrSummaryData = null;
    let unsavedShrDetailsData = null;
    let unsavedShrSelectedDates = {};
    let isUnsavedShrBulkSaving = false;

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeJs(str) {
      return String(str == null ? "" : str)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }

    let messageHideTimer = null;

    function isPersistentProgressMessage(text, type) {
      if (type !== "warn") return false;

      const value = String(text || "");

      return (
        value.indexOf("保存中") !== -1 ||
        value.indexOf("登録中") !== -1 ||
        value.indexOf("読み込み") !== -1 ||
        value.indexOf("確認中") !== -1 ||
        value.indexOf("切り替えています") !== -1 ||
        value.indexOf("解除しています") !== -1 ||
        value.indexOf("戻っています") !== -1
      );
    }

    function getMessageAutoHideMs(text, type) {
      if (isPersistentProgressMessage(text, type)) {
        return 0;
      }

      if (type === "success") {
        return 3000;
      }

      if (type === "error") {
        return 6000;
      }

      return 4000;
    }

    function showMessage(text, type) {
      const el = document.getElementById("messageArea");
      if (!el) return;

      if (messageHideTimer) {
        window.clearTimeout(messageHideTimer);
        messageHideTimer = null;
      }

      el.textContent = String(text || "");
      el.className = "message show";

      if (type) {
        el.classList.add(type);
      }

      el.setAttribute(
        "role",
        type === "error" ? "alert" : "status"
      );

      const autoHideMs = getMessageAutoHideMs(text, type);

      if (autoHideMs > 0) {
        messageHideTimer = window.setTimeout(function() {
          clearMessage();
        }, autoHideMs);
      }
    }

    function clearMessage() {
      const el = document.getElementById("messageArea");

      if (messageHideTimer) {
        window.clearTimeout(messageHideTimer);
        messageHideTimer = null;
      }

      if (!el) return;

      el.textContent = "";
      el.className = "message";
    }

    function getSelectedUnsavedShrDates() {
      return Object.keys(unsavedShrSelectedDates)
        .filter(function(dateStr) {
          return !!unsavedShrSelectedDates[dateStr];
        })
        .sort();
    }

    function resetUnsavedShrBulkSelection() {
      unsavedShrSelectedDates = {};
      updateUnsavedShrBulkControls();
    }

    function updateUnsavedShrBulkControls() {
      const selectedDates = getSelectedUnsavedShrDates();
      const countEl = document.getElementById("unsavedShrSelectedCount");
      const saveBtn = document.getElementById("unsavedShrBulkSaveBtn");

      if (countEl) {
        countEl.textContent = selectedDates.length + "件選択";
      }

      if (saveBtn) {
        saveBtn.textContent = isUnsavedShrBulkSaving
          ? "登録中..."
          : "選択したSHRを欠席者なしで登録";

        saveBtn.disabled =
          selectedDates.length === 0 ||
          isUnsavedShrBulkSaving ||
          isLoading ||
          isSaving;
      }
    }

    function setUnsavedShrBulkSaving(flag) {
      isUnsavedShrBulkSaving = !!flag;

      const disabled =
        isUnsavedShrBulkSaving ||
        isLoading ||
        isSaving;

      document.getElementById("reloadBtn").disabled = disabled;
      document.getElementById("saveBtnTop").disabled = disabled;
      document.getElementById("saveBtnBottom").disabled = disabled;
      document.getElementById("dateInput").disabled = disabled;

      updateUnsavedShrBulkControls();

      if (unsavedShrDetailsData) {
        renderUnsavedShrDetails(unsavedShrDetailsData);
      }

      if (flag) {

      const currentLoadedKey = requestKey;

      if (!forceReload && unsavedShrDetailsLoadedKey === currentLoadedKey) {
        return;

      unsavedShrDetailsRequestKey = requestKey;
      renderUnsavedShrDetailsLoading();

      google.script.run
        .withSuccessHandler(function(data) {
          if (unsavedShrDetailsRequestKey !== requestKey) return;
          unsavedShrDetailsLoadedKey = currentLoadedKey;
          unsavedShrDetailsData = data || null;
          renderUnsavedShrDetails(unsavedShrDetailsData);
        })

          if (unsavedShrDetailsRequestKey !== requestKey) return;

    function saveSelectedUnsavedShrNoAbsence() {
      if (
        isLoading ||
        isSaving ||
        isUnsavedShrBulkSaving ||
        !selectedGrade ||
        !selectedUnit
      ) {
        return;
      }

      const selectedDates = getSelectedUnsavedShrDates();

      if (!selectedDates.length) {
        showMessage("一括登録するSHRを選択してください。", "error");
        return;
      }

      const confirmed = window.confirm(
        "選択した " +
        selectedDates.length +
        " 件のSHRを「欠席者なし」として一括登録します。\n\n" +
        "欠席・遅刻・早退がない日だけ選択してください。\n\n" +
        "よろしいですか？"
      );

      if (!confirmed) {
        return;
      }

      clearMessage();
      setUnsavedShrBulkSaving(true);

      google.script.run
        .withSuccessHandler(function(result) {
          const savedDates =
            result && Array.isArray(result.savedDates)
              ? result.savedDates.map(function(value) {
                  return String(value || "").trim();
                }).filter(Boolean)
              : [];

          setUnsavedShrBulkSaving(false);

          if (!savedDates.length) {
            showMessage(
              "一括登録は完了しましたが、保存結果を確認できませんでした。未保存一覧を再読み込みしてください。",
              "error"
            );
            loadUnsavedShrSummary();
            return;
          }

          const savedDateSet = {};
          savedDates.forEach(function(dateStr) {
            savedDateSet[dateStr] = true;
            delete unsavedShrSelectedDates[dateStr];
          });

          if (
            unsavedShrDetailsData &&
            Array.isArray(unsavedShrDetailsData.items)
          ) {
            unsavedShrDetailsData.items =
              unsavedShrDetailsData.items.filter(function(item) {
                return !savedDateSet[String(item.date || "").trim()];
              });
          }

          if (
            unsavedShrSummaryData &&
            typeof unsavedShrSummaryData.count === "number"
          ) {
            unsavedShrSummaryData.count = Math.max(
              0,
              unsavedShrSummaryData.count - savedDates.length
            );
          }

          renderUnsavedShrSummary(unsavedShrSummaryData);

          if (unsavedShrDetailsOpen && unsavedShrDetailsData) {
            renderUnsavedShrDetails(unsavedShrDetailsData);
          }

          if (savedDateSet[String(currentDate || "").trim()]) {
            currentShrHasSavedSession = true;
            currentShrLastSavedInfo = {
              teacherEmail: "",
              savedAtText: result && result.savedAtText ? result.savedAtText : "",
              actionType: "homeroom-shr",
              targetSessionKey: "",
              savedModeLabel:
                result && result.savedModeLabel
                  ? result.savedModeLabel
                  : "担任SHR（欠席者なし）",
              savedByCurrentUser: true
            };
            renderShrActionSelection(currentShrLastSavedInfo);
          }

          showMessage(
            savedDates.length + "件のSHRを欠席者なしとして一括登録しました。",
            "success"
          );
        })
        .withFailureHandler(function(error) {
          console.error(error);
          setUnsavedShrBulkSaving(false);
          showMessage(
            "SHR一括登録に失敗しました。 " +
              (error && error.message ? error.message : ""),
            "error"
          );
          loadUnsavedShrSummary();
        })
        .saveHomeroomShrUnsavedBulkNoAbsence({
          grade: selectedGrade,
          unit: selectedUnit,
          dates: selectedDates
        });
    }

function renderSummaryCounts() {
      let present = 0;
      let absent = 0;
      let late = 0;
      let early = 0;

      studentsState.forEach(function(student) {
        const code = String(student.statusCode || "");
        if (code === "A") absent++;
        else if (code === "L") late++;
        else if (code === "E") early++;
        else present++;
      });

      document.getElementById("countPresent").textContent = present;
      document.getElementById("countAbsent").textContent = absent;
      document.getElementById("countLate").textContent = late;
      document.getElementById("countEarly").textContent = early;
    }

    function renderTable() {
      const container = document.getElementById("tableContainer");

      if (!studentsState.length) {
        container.innerHTML = '<div class="empty-box">対象の学生が見つかりませんでした。</div>';
        renderSummaryCounts();
        return;
      }

      const rowsHtml = studentsState.map(function(student, idx) {
        const rowClass = student.statusCode ? "modified-row" : "";
        const safeName = escapeHtml(student.name || "");
        const attendanceNo = escapeHtml(student.attendanceNumber || "");
        const studentId = escapeHtml(student.studentId || "");
        const groupName = 'status_' + studentId;

        const radios = STATUS_OPTIONS.map(function(option) {
          const checked = String(student.statusCode || "") === option.code ? ' checked' : '';
          return '' +
            '<td>' +
              '<label class="radio-label ' + option.className + '">' +
                '<input type="radio" name="' + groupName + '" value="' + escapeHtml(option.code) + '"' + checked +
                ' onchange="updateStudentStatus(' + idx + ', \'' + escapeJs(option.code) + '\')">' +
                '<span>' + escapeHtml(option.label) + '</span>' +
              '</label>' +
            '</td>';
        }).join("");

        return '' +
          '<tr class="' + rowClass + '">' +
            '<td class="no-col">' + attendanceNo + '</td>' +
            '<td class="name-col">' +
              '<div class="student-name">' + safeName + '</div>' +
              '<div class="student-meta">' + studentId + '</div>' +
            '</td>' +
            radios +
          '</tr>';
      }).join("");

      container.innerHTML = '' +
        '<table>' +
          '<thead>' +
            '<tr>' +
              '<th class="no-col">出席番号</th>' +
              '<th class="name-col">氏名</th>' +

  console.log("saveHomeroomShrAttendance result =", result);
  setSaving(false);
  showMessage("保存しました。", "success");
  document.getElementById("saveState").textContent = "保存済み";
  renderHomeroomLastSavedInfo(result && result.lastSavedInfo ? result.lastSavedInfo : null);
  loadUnsavedShrSummary();
  if (unsavedShrDetailsOpen) {
    loadUnsavedShrDetails(true);
  }
})
        .withFailureHandler(function(error) {
          console.error(error);
          setSaving(false);
          showMessage("保存に失敗しました。 " + (error && error.message ? error.message : ""), "error");
        })
        .saveHomeroomShrAttendance(payload);
    }

function saveShrNoAbsence() {
  if (isLoading || isSaving || isUnsavedShrBulkSaving) return;

  const dateValue = document.getElementById("dateInput").value;
  if (!selectedGrade || !selectedUnit || !dateValue) {
    showMessage("クラス・日付を確認してください。", "error");
    return;
  }

  if (!window.confirm("このSHRを「欠席者なし」として保存します。よろしいですか？")) {
    return;
  }

  clearMessage();
  setSaving(true);

  google.script.run
    .withSuccessHandler(function(result) {
      setSaving(false);
      showMessage("欠席者なしとして保存しました。", "success");
      document.getElementById("saveState").textContent = "保存済み";
      renderHomeroomLastSavedInfo(result && result.lastSavedInfo ? result.lastSavedInfo : null);
    currentShrHasSavedSession = true;
    currentShrLastSavedInfo = result && result.lastSavedInfo ? result.lastSavedInfo : null;

    loadUnsavedShrSummary();
    renderShrActionSelection(currentShrLastSavedInfo);
    })
    .withFailureHandler(function(error) {
      console.error(error);
      setSaving(false);
      showMessage("欠席者なし保存に失敗しました。 " + (error && error.message ? error.message : ""), "error");
    })
    .saveHomeroomShrNoAbsence({
      grade: selectedGrade,
      unit: selectedUnit,
      date: dateValue
    });
}

function goShrHome() {
  showMessage("トップへ戻っています...", "warn");

  google.script.run
    .withSuccessHandler(function(baseUrl) {
      const url = baseUrl || window.location.href.split("?")[0];
      window.top.location.href = url + "?page=index";
    })
    .withFailureHandler(function(error) {
      console.error(error);

      const fallbackUrl =
        window.location.href.split("?")[0] + "?page=index";

      window.top.location.href = fallbackUrl;
    })
    .getAppBaseUrl();
}


    document.getElementById("reloadBtn").addEventListener("click", loadDailyData);
document.getElementById("saveBtnTop").addEventListener("click", saveAttendance);
document.getElementById("saveBtnBottom").addEventListener("click", saveAttendance);
document.getElementById("dateInput").addEventListener("change", function() {
  currentDate = document.getElementById("dateInput").value || currentDate;

  currentShrHasSavedSession = false;
  currentShrLastSavedInfo = null;

  renderShrActionSelection();
  loadShrDailyStatus();
});
document.getElementById("unsavedShrToggleBtn").addEventListener("click", toggleUnsavedShrDetails);
document.getElementById("backBtn").addEventListener("click", goShrHome);
document.getElementById("backHomeTopBtn").addEventListener("click", goShrHome);

    loadInitialData();
  </script>
